<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00ffcc">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS-ID.HUB - Светофор</title>
    <style>
        body {
            background-color: #1a261c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Общая внешняя рамка приложения */
        .app-card {
            background-color: #24342a;
            border: 2px solid #4a6b54;
            border-radius: 20px;
            padding: 30px 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #fff;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 24px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 128, 0.5);
            text-align: center;
        }

        /* Общий блок: светофор + ножка + ссылка */
        .traffic-pole-assembly {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Корпус светофора с неоновой обводкой */
        .traffic-light-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
            padding: 22px 16px;
            background: #0d120f;
            border-radius: 42px;
            position: relative;
            
            border: 3px solid #00ffcc;
            box-shadow: 0 0 15px #00ffcc, 
                        inset 0 0 15px rgba(0, 255, 204, 0.4),
                        0 10px 30px rgba(0,0,0,0.8);
            
            animation: neon-glow 2.5s infinite alternate;
        }

        @keyframes neon-glow {
            0% {
                border-color: #00ffcc;
                box-shadow: 0 0 10px #00ffcc, inset 0 0 10px rgba(0, 255, 204, 0.3), 0 10px 30px rgba(0,0,0,0.8);
            }
            100% {
                border-color: #00ff66;
                box-shadow: 0 0 25px #00ff66, inset 0 0 20px rgba(0, 255, 102, 0.6), 0 10px 30px rgba(0,0,0,0.8);
            }
        }

        /* Металлическая ножка */
        .pole {
            width: 18px;
            height: 90px;
            background: linear-gradient(90deg, #222, #666, #111);
            box-shadow: 4px 5px 15px rgba(0,0,0,0.6);
        }

        /* Кликливая неоновая ссылка под ножкой */
        .tech-link {
            margin-top: 15px;
            color: #00ffcc;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.7);
            transition: color 0.2s ease, text-shadow 0.2s ease, transform 0.2s ease;
        }

        .tech-link:hover {
            color: #ffeb3b;
            text-shadow: 0 0 12px rgba(255, 235, 59, 0.9);
            transform: scale(1.05);
        }

        /* Кнопки-сигналы с текстом */
        .sos-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border: 4px solid #fff;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.5), 
                        inset 0 0 15px rgba(255, 255, 255, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        /* Цвета светофора */
        .btn-red { background-color: #d9534f; }
        .btn-yellow { background-color: #f0ad4e; }
        .btn-green { background-color: #5cb85c; }

        /* Эффекты при наведении */
        .sos-button:hover {
            transform: scale(1.06);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.9),
                        inset 0 0 20px rgba(255, 255, 255, 0.6);
            border-color: #ffeb3b;
        }

        .sos-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Внешняя карточка-граница приложения -->
    <div class="app-card">
        <h1>SOS-ID.HUB</h1>

        <div class="traffic-pole-assembly">
            <!-- Корпус светофора с неоновой обводкой -->
            <div class="traffic-light-container">
                <!-- 1. Красный: SOS -->
                <a href="https://sos-id.online" class="sos-button btn-red" target="_blank" title="Экстренный SOS">
                    SOS
                </a>

                <!-- 2. Желтый: ID -->
                <a href="https://pet.sos-id.online" class="sos-button btn-yellow" target="_blank" title="Идентификатор / Дневник">
                    ID
                </a>

                <!-- 3. Зеленый: ONLINE -->
                <a href="https://diabet-diary.chebur.shop" class="sos-button btn-green" target="_blank" title="Онлайн портал">
                    ONLINE
                </a>
            </div>

            <!-- Металлическая ножка -->
            <div class="pole"></div>

            <!-- Неоновая кликабельная ссылка под ножкой -->
            <a href="https://tech.chebur.shop" class="tech-link" target="_blank">tech.chebur.shop</a>
        </div>
    </div>

</body>
</html>
